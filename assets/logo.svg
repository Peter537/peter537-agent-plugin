  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <path d="M158 264 C270 154 392 128 512 128 C674 128 800 208 866 336" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  <path d="M866 688 C800 816 674 896 512 896 C366 896 244 830 174 720" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  <circle cx="158" cy="264" r="32" fill="#22D3EE"/>
  <circle cx="866" cy="336" r="32" fill="#8B5CF6"/>
  <circle cx="866" cy="688" r="32" fill="#22D3EE"/>
  <circle cx="174" cy="720" r="32" fill="#8B5CF6"/>
  <rect x="142" y="324" width="740" height="376" rx="96" fill="#0B1730" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" filter="url(#shadow)"/>
  <text x="512" y="570" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="218" font-weight="800" letter-spacing="-12" text-anchor="middle">P537</text>
  <rect x="320" y="620" width="384" height="18" rx="9" fill="url(#accent)"/>
